<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Songless Unlimited</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8E%A4</text></svg>">
<link rel="stylesheet" href="game.css">
<style>
  /* Shared styles live in game.css. Popular Hip-Hop uses the gold accent
     rather than the Spotify green. */
  .badge {
    color: var(--gold);
    background: rgba(240,180,41,0.1);
    border-color: rgba(240,180,41,0.28);
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><a href="/" class="home">Songless <span class="mark">Unlimited</span></a></h1>
    <div class="badge">🎤 Hip-Hop &amp; Rap</div>
    <div class="toolbar">
      <button class="btn-sm" id="btn-eras">Eras</button>
      <button class="btn-sm" id="btn-stats">Stats</button>
      <button class="btn-sm" id="btn-how">How to play</button>
    </div>
  </header>

  <div id="app"><div class="loading">Loading catalog…</div></div>

</div>

<div class="modal" id="modal" hidden>
  <div class="inner">
    <div id="modal-body"></div>
    <button class="btn-wide" id="modal-close" style="margin-top:16px">Close</button>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
'use strict'

/* ============================ constants ============================ */

const STAGES = [0.1, 0.5, 1, 2, 4, 7, 11, 16]   // seconds unlocked per attempt
const MAX_ATTEMPTS = STAGES.length
const FULL = STAGES[STAGES.length - 1]

// Seconds -> label. Sub-second stages need a decimal; whole ones shouldn't show one.
const fmt = s => (s < 1 ? s.toFixed(1) : String(s))

// The ladder spans 0.1s to 16s, so a linear timeline would squash the early
// stages into an invisible sliver. Square-root scaling gives them real width.
const scale = t => Math.sqrt(Math.max(0, t) / FULL) * 100
const STORE_KEY = 'songless-unlimited-stats-v1'
const BAG_KEY = 'songless-unlimited-bag-v1'
const ERAS_KEY = 'songless-unlimited-eras-v1'

// Decades present in the catalog (1985–2025).
const ERAS = [1980, 1990, 2000, 2010, 2020]
const eraLabel = d => (d === 2000 ? '00s' : `${String(d).slice(2)}s`)
const decadeOf = s => (s.year ? Math.floor(s.year / 10) * 10 : null)

/* ============================ state ============================ */

let CATALOG = []   // everything that shipped
let POOL = []      // what the selected eras allow
let pendingEras = null
let song = null
let guesses = []          // {label, trackId, kind:'wrong'|'skip'|'correct'}
let finished = false
let won = false
let selIdx = -1
let lastSuggestions = []

const audio = new Audio()
audio.preload = 'auto'
let rafId = null
let cutId = null
let stopAt = 0

const $ = id => document.getElementById(id)
// Coarse pointer means touch: no hover, and an on-screen keyboard that should
// not be summoned on our initiative.
const COARSE = typeof matchMedia === 'function' && matchMedia('(pointer: coarse)').matches


/* ============================ helpers ============================ */

const norm = s => (s || '')
  .toLowerCase()
  .normalize('NFKD')
  .replace(/[̀-ͯ]/g, '')
  .replace(/\(.*?\)|\[.*?\]/g, ' ')
  .replace(/&/g, ' and ')
  .replace(/[^a-z0-9]+/g, ' ')
  .trim()

const label = s => `${s.artist} — ${s.title}`
const unlocked = () => STAGES[Math.min(guesses.length, MAX_ATTEMPTS - 1)]
const bigArt = u => (u || '').replace(/\/\d+x\d+bb\./, '/600x600bb.')

function toast(msg) {
  const t = $('toast')
  t.textContent = msg
  t.hidden = false
  clearTimeout(toast._t)
  toast._t = setTimeout(() => { t.hidden = true }, 1900)
}

/* ============================ stats ============================ */

function loadStats() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY) || '')
    if (s && typeof s === 'object') {
      return { played: 0, wins: 0, streak: 0, best: 0, dist: Array(MAX_ATTEMPTS).fill(0), ...s }
    }
  } catch {}
  return { played: 0, wins: 0, streak: 0, best: 0, dist: Array(MAX_ATTEMPTS).fill(0) }
}

function saveStats(s) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(s)) } catch {}
}

function recordResult(didWin, attempts) {
  const s = loadStats()
  s.played++
  if (didWin) {
    s.wins++
    s.streak++
    s.best = Math.max(s.best, s.streak)
    s.dist[attempts - 1] = (s.dist[attempts - 1] || 0) + 1
  } else {
    s.streak = 0
  }
  saveStats(s)
}

/* ============================ song selection ============================ */

// Shuffle bag: play through the whole catalog before any repeats.
function nextFromBag(pool = POOL) {
  let bag = []
  try { bag = JSON.parse(localStorage.getItem(BAG_KEY) || '[]') } catch {}
  bag = Array.isArray(bag) ? bag.filter(id => pool.some(s => s.trackId === id)) : []

  if (!bag.length) {
    bag = pool.map(s => s.trackId)
    for (let i = bag.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1))
      ;[bag[i], bag[j]] = [bag[j], bag[i]]
    }
    // Avoid immediately repeating the song we just played.
    if (song && bag.length > 1 && bag[bag.length - 1] === song.trackId) {
      ;[bag[0], bag[bag.length - 1]] = [bag[bag.length - 1], bag[0]]
    }
  }

  const id = bag.pop()
  try { localStorage.setItem(BAG_KEY, JSON.stringify(bag)) } catch {}
  return pool.find(s => s.trackId === id) || pool[0]
}

/* ============================ eras ============================ */

function loadEras() {
  try {
    const v = JSON.parse(localStorage.getItem(ERAS_KEY))
    const clean = Array.isArray(v) ? v.filter(d => ERAS.includes(d)) : []
    if (clean.length) return clean
  } catch {}
  return [...ERAS]
}

const inEras = (s, sel) => {
  const d = decadeOf(s)
  // A track with no year is never excluded by an era choice.
  return d === null || sel.includes(d)
}

function eraCounts() {
  const c = {}
  for (const d of ERAS) c[d] = 0
  for (const s of CATALOG) {
    const d = decadeOf(s)
    if (d !== null && d in c) c[d]++
  }
  return c
}

const countFor = sel => CATALOG.filter(s => inEras(s, sel)).length

function applyEras() {
  const sel = loadEras()
  POOL = CATALOG.filter(s => inEras(s, sel))
  // Never leave the game with nothing to play.
  if (!POOL.length) POOL = CATALOG.slice()
}

function erasHtml() {
  const counts = eraCounts()
  const sel = pendingEras
  const total = countFor(sel)
  return `
    <h2>Eras</h2>
    <div class="eras">
      ${ERAS.map(d => `
        <button class="era ${sel.includes(d) ? 'on' : ''}" data-d="${d}"
                aria-pressed="${sel.includes(d)}">
          <span class="tick" aria-hidden="true">✓</span>
          <b>${eraLabel(d)}</b><span>${counts[d]}</span>
        </button>`).join('')}
    </div>
    <p class="note" style="margin-top:15px">
      <b style="color:var(--gold);font-size:1.05rem">${total}</b>
      song${total === 1 ? '' : 's'} in play
    </p>
    <button class="btn-wide btn-primary" id="era-apply" ${total ? '' : 'disabled'}>
      ${total ? 'Play these eras' : 'Pick at least one era'}
    </button>`
}

function wireEras() {
  for (const b of document.querySelectorAll('.era')) {
    b.onclick = () => {
      const d = Number(b.dataset.d)
      pendingEras = pendingEras.includes(d)
        ? pendingEras.filter(x => x !== d)
        : [...pendingEras, d].sort((a, z) => a - z)
      openModal(erasHtml())
      wireEras()
    }
  }
  const apply = $('era-apply')
  if (apply) apply.onclick = () => {
    try { localStorage.setItem(ERAS_KEY, JSON.stringify(pendingEras)) } catch {}
    // The shuffle bag holds ids from the old selection.
    try { localStorage.removeItem(BAG_KEY) } catch {}
    applyEras()
    $('modal').hidden = true
    stopAudio()
    newRound()
  }
}

/* ============================ audio ============================ */

function setPlayingUi(on) {
  const btn = $('btn-play')
  if (btn) btn.classList.toggle('playing', on)
  const bar = document.querySelector('.track .unlocked')
  if (bar) bar.classList.toggle('live', on)
}

function stopAudio() {
  audio.pause()
  if (rafId) cancelAnimationFrame(rafId)
  rafId = null
  if (cutId) clearTimeout(cutId)
  cutId = null
  const p = document.querySelector('.played')
  if (p) p.style.width = '0%'
  const b = $('play-ic')
  if (b) b.innerHTML = ICON_PLAY
  setPlayingUi(false)
}

function tick() {
  const p = document.querySelector('.played')
  if (p) p.style.width = `${Math.min(100, scale(audio.currentTime))}%`
  if (audio.currentTime >= stopAt) {
    stopAudio()
    return
  }
  rafId = requestAnimationFrame(tick)
}

function playClip(seconds) {
  stopAudio()
  stopAt = seconds
  // Setting currentTime before any data has loaded throws in some browsers.
  if (audio.readyState > 0) {
    try { audio.currentTime = 0 } catch {}
  }
  audio.play().then(() => {
    $('play-ic').innerHTML = ICON_STOP
    setPlayingUi(true)
    // A 0.1s clip is ~6 animation frames, so rAF alone can overshoot by 15%+.
    // Timer does the cut; rAF only drives the progress bar.
    cutId = setTimeout(stopAudio, Math.max(30, seconds * 1000))
    rafId = requestAnimationFrame(tick)
  }).catch(err => {
    toast('Could not play audio')
    console.error('playback failed', err)
  })
}

function togglePlay() {
  if (!audio.paused) { stopAudio(); return }
  playClip(unlocked())
}

// If a baked-in preview URL has rotated, re-resolve it live by trackId.
async function repairPreview(s) {
  try {
    const r = await fetch(`https://itunes.apple.com/lookup?id=${encodeURIComponent(s.trackId)}&entity=song`)
    const j = await r.json()
    const hit = (j.results || []).find(x => x.previewUrl)
    if (hit && hit.previewUrl) {
      s.previewUrl = hit.previewUrl
      return true
    }
  } catch (err) {
    console.error('repair failed', err)
  }
  return false
}

/* ============================ icons ============================ */

const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.87l10-6.5a1 1 0 0 0 0-1.74l-10-6.5A1 1 0 0 0 8 5.5Z"/></svg>'
const ICON_STOP = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>'

/* ============================ rendering ============================ */

function render() {
  const app = $('app')

  if (finished) { renderReveal(app); return }

  const pct = scale(unlocked())

  app.innerHTML = `
    <div class="card">
      <div class="player">
        <button class="play-btn" id="btn-play" aria-label="Play clip">
          <span id="play-ic">${ICON_PLAY}</span>
        </button>
        <div class="timeline">
          <div class="track">
            <div class="unlocked" style="width:${pct}%"></div>
            <div class="played"></div>
          </div>
          <div class="ticks">
            ${STAGES.map(s => `<span class="${s <= unlocked() ? 'on' : ''}" style="left:${scale(s)}%">${fmt(s)}s</span>`).join('')}
          </div>
          <div class="meta-row">
            <span><b style="color:var(--gold)">${fmt(unlocked())}s</b> unlocked &middot; ${MAX_ATTEMPTS - guesses.length} ${MAX_ATTEMPTS - guesses.length === 1 ? 'try' : 'tries'} left</span>
            <span class="vol">
              <span aria-hidden="true">🔊</span>
              <input type="range" id="vol" min="0" max="1" step="0.01" value="${audio.volume}" aria-label="Volume">
            </span>
          </div>
        </div>
      </div>

      <div class="guesses">
        ${Array.from({ length: MAX_ATTEMPTS }, (_, i) => {
          const g = guesses[i]
          if (g) {
            const ic = g.kind === 'correct' ? '✔' : g.kind === 'skip' ? '⏭' : '✕'
            const just = i === guesses.length - 1 ? ' just' : ''
            return `<div class="slot filled ${g.kind}${just}"><span class="ic">${ic}</span><span class="txt">${esc(g.label)}</span></div>`
          }
          const active = i === guesses.length
          return `<div class="slot ${active ? 'active' : ''}"><span class="ic">${active ? '▸' : ''}</span><span class="txt">${active ? 'Your guess…' : ''}</span></div>`
        }).join('')}
      </div>

      <div class="guess-area">
        <div class="suggest" id="suggest"></div>
        <input type="text" id="guess" autocomplete="off" spellcheck="false"
               placeholder="Type an artist or song title…">
        <div class="actions">
          <button id="btn-skip">Skip (+${fmt(nextGain())}s)</button>
          <button class="btn-primary" id="btn-submit" disabled>Submit</button>
        </div>
      </div>
    </div>
  `

  $('btn-play').onclick = togglePlay
  $('btn-skip').onclick = doSkip
  $('btn-submit').onclick = submitGuess
  $('vol').oninput = e => { audio.volume = Number(e.target.value) }

  const input = $('guess')
  input.oninput = onInput
  input.onkeydown = onKeyDown
  // On a phone, re-focusing after every guess or skip yanks the keyboard back
  // open and shoves the layout around. Let the user decide when to type.
  if (!COARSE) input.focus()
}

function nextGain() {
  const i = guesses.length
  const cur = STAGES[Math.min(i, MAX_ATTEMPTS - 1)]
  const nxt = STAGES[Math.min(i + 1, MAX_ATTEMPTS - 1)]
  return Math.round((nxt - cur) * 10) / 10
}

function renderReveal(app) {
  const s = loadStats()
  app.innerHTML = `
    <div class="card reveal ${won ? 'win' : 'lose'}">
      ${won ? `<div class="confetti" aria-hidden="true">${Array.from({ length: 14 }, (_, i) => `<i style="--i:${i}"></i>`).join('')}</div>` : ''}
      <img class="art" id="art" alt="" src="${esc(bigArt(song.artworkUrl))}">
      <div class="verdict ${won ? 'win' : 'lose'}">
        ${won ? `Got it in ${guesses.length} ${guesses.length === 1 ? 'try' : 'tries'}` : 'Out of tries'}
      </div>
      <div class="ttl">${esc(song.title)}</div>
      <div class="art-name">${esc(song.artist)}</div>
      <div class="alb">${esc(song.album || '')}${song.year ? ` &middot; ${song.year}` : ''}</div>
      <audio controls src="${esc(song.previewUrl)}" style="margin-top:16px"></audio>
      <div class="actions" style="margin-top:16px">
        <button id="btn-share">Share</button>
        <button class="btn-primary" id="btn-next">Next song</button>
      </div>
      <p class="note">
        Streak <b style="color:var(--gold)">${s.streak}</b> &middot;
        ${s.wins}/${s.played} solved
      </p>
    </div>
  `
  $('art').onerror = e => { e.target.style.visibility = 'hidden' }
  $('btn-next').onclick = newRound
  $('btn-share').onclick = share
}

function esc(str) {
  return String(str ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
}

/* ============================ autocomplete ============================ */

function onInput() {
  const q = norm($('guess').value)
  const box = $('suggest')
  selIdx = -1

  if (q.length < 2) {
    box.innerHTML = ''
    lastSuggestions = []
    $('btn-submit').disabled = true
    return
  }

  const starts = [], contains = []
  for (const s of POOL) {
    const hay = s._search
    const i = hay.indexOf(q)
    if (i === 0) starts.push(s)
    else if (i > 0) contains.push(s)
    if (starts.length >= 60) break
  }

  lastSuggestions = [...starts, ...contains].slice(0, 8)
  box.innerHTML = lastSuggestions
    .map((s, i) => `<div data-i="${i}"><span>${esc(s.title)}</span> <span class="ar">— ${esc(s.artist)}</span></div>`)
    .join('')

  for (const el of box.children) {
    el.onclick = () => pick(Number(el.dataset.i))
  }

  $('btn-submit').disabled = lastSuggestions.length === 0
}

function pick(i) {
  const s = lastSuggestions[i]
  if (!s) return
  $('guess').value = label(s)
  $('suggest').innerHTML = ''
  lastSuggestions = [s]
  selIdx = 0
  $('btn-submit').disabled = false
  submitGuess()
}

function onKeyDown(e) {
  const box = $('suggest')
  const n = box.children.length

  if (e.key === 'ArrowDown' && n) {
    e.preventDefault()
    selIdx = (selIdx + 1) % n
    highlight()
  } else if (e.key === 'ArrowUp' && n) {
    e.preventDefault()
    selIdx = selIdx <= 0 ? n - 1 : selIdx - 1
    highlight()
  } else if (e.key === 'Enter') {
    e.preventDefault()
    if (selIdx >= 0) pick(selIdx)
    else submitGuess()
  } else if (e.key === 'Escape') {
    box.innerHTML = ''
    selIdx = -1
  }
}

function highlight() {
  const box = $('suggest')
  for (const [i, el] of [...box.children].entries()) {
    el.classList.toggle('sel', i === selIdx)
  }
}

/* ============================ game actions ============================ */

function submitGuess() {
  if (finished) return

  const raw = $('guess').value.trim()
  if (!raw) { toast('Type a guess, or hit Skip'); return }

  // Resolve the typed text to a catalog entry.
  const q = norm(raw)
  let guessed = lastSuggestions.find(s => norm(label(s)) === q)
    || POOL.find(s => norm(label(s)) === q)
    || POOL.find(s => s._search === q)
    || (lastSuggestions.length === 1 ? lastSuggestions[0] : null)

  if (!guessed) {
    toast('Pick a song from the list')
    return
  }

  // A repeat of an earlier guess shouldn't burn an attempt.
  if (guesses.some(g => g.trackId && g.trackId === guessed.trackId)) {
    toast('You already guessed that one')
    $('guess').select()
    return
  }

  const correct = guessed.trackId === song.trackId
    || norm(guessed.title) === norm(song.title) && norm(guessed.artist) === norm(song.artist)

  guesses.push({ label: label(guessed), trackId: guessed.trackId, kind: correct ? 'correct' : 'wrong' })

  if (correct) {
    finish(true)
  } else if (guesses.length >= MAX_ATTEMPTS) {
    finish(false)
  } else {
    render()
    playClip(unlocked())
  }
}

function doSkip() {
  if (finished) return
  guesses.push({ label: `Skipped (+${fmt(nextGain())}s)`, trackId: null, kind: 'skip' })
  if (guesses.length >= MAX_ATTEMPTS) {
    finish(false)
  } else {
    render()
    playClip(unlocked())
  }
}

function finish(didWin) {
  finished = true
  won = didWin
  stopAudio()
  recordResult(didWin, guesses.length)
  render()
}

const dead = new Set()   // trackIds whose preview failed this session

async function newRound(attempt = 0) {
  stopAudio()
  guesses = []
  finished = false
  won = false
  selIdx = -1
  lastSuggestions = []

  // Give up rotating after a handful of dead tracks rather than recursing forever.
  if (attempt >= 6) {
    $('app').innerHTML = `
      <div class="card">
        <div class="err"><b>Could not load any playable track.</b><br>
        Several previews in a row failed, which usually means no internet
        connection or Apple's preview CDN is unreachable.</div>
        <button class="btn-wide btn-primary" onclick="location.reload()">Retry</button>
      </div>`
    return
  }

  const pool = POOL.filter(s => !dead.has(s.trackId))
  song = nextFromBag(pool.length ? pool : POOL)
  audio.src = song.previewUrl

  render()

  // Verify the clip is actually loadable; repair or rotate past it if not.
  const ok = await new Promise(res => {
    let settled = false
    const done = v => { if (!settled) { settled = true; res(v) } }
    audio.addEventListener('canplay', () => done(true), { once: true })
    audio.addEventListener('error', () => done(false), { once: true })
    setTimeout(() => done(!!audio.duration), 7000)
  })

  if (!ok) {
    const fixed = await repairPreview(song)
    if (fixed) {
      audio.src = song.previewUrl
    } else {
      console.warn('dropping unplayable track', song)
      dead.add(song.trackId)
      toast('Skipping an unplayable track…')
      return newRound(attempt + 1)
    }
  }
}

function share() {
  const grid = guesses.map(g => g.kind === 'correct' ? '🟩' : g.kind === 'skip' ? '🟨' : '🟥').join('')
  const pad = '⬛'.repeat(Math.max(0, MAX_ATTEMPTS - guesses.length))
  const text = `🎤 Songless Unlimited — Hip-Hop/Rap\n${won ? `${guesses.length}/${MAX_ATTEMPTS}` : 'X/' + MAX_ATTEMPTS} ${grid}${pad}\n\n${location.href.split('#')[0]}#t=${song.trackId}`

  navigator.clipboard?.writeText(text)
    .then(() => toast('Result + challenge link copied'))
    .catch(() => toast('Copy failed'))
}

/* ============================ modals ============================ */

function openModal(html) {
  $('modal-body').innerHTML = html
  $('modal').hidden = false
}

function statsHtml() {
  const s = loadStats()
  const rate = s.played ? Math.round((s.wins / s.played) * 100) : 0
  const max = Math.max(1, ...s.dist)
  return `
    <h2>Your stats</h2>
    <div class="stat-grid">
      <div class="stat"><b>${s.played}</b><span>Played</span></div>
      <div class="stat"><b>${rate}%</b><span>Win rate</span></div>
      <div class="stat"><b>${s.streak}</b><span>Streak</span></div>
      <div class="stat"><b>${s.best}</b><span>Best</span></div>
    </div>
    <div class="dist">
      ${s.dist.map((n, i) => `
        <div class="row ${n === max && n > 0 ? 'best' : ''}">
          <span class="n">${i + 1}</span>
          <div class="bar" style="width:${Math.max(8, (n / max) * 100)}%">${n}</div>
        </div>`).join('')}
    </div>
    <p class="note">Wins by number of tries.<br>
      ${POOL.length} of ${CATALOG.length} songs in play${POOL.length === CATALOG.length ? '' : ' — see Eras'}.</p>
  `
}

const HOW_HTML = `
  <h2>How to play</h2>
  <p style="font-size:.88rem;line-height:1.65;color:var(--dim)">
    You get <b style="color:var(--text)">${MAX_ATTEMPTS} tries</b> to name the track.
    Press play and you hear the first <b style="color:var(--text)">0.1 seconds</b>.
    Every wrong guess or skip unlocks more:
    <b style="color:var(--gold)">${STAGES.map(fmt).join('s → ')}s</b>.
  </p>
  <p style="font-size:.88rem;line-height:1.65;color:var(--dim)">
    Start typing to search the catalog — you have to pick a song from the
    dropdown for it to count. Arrow keys and Enter work.
  </p>
  <p style="font-size:.88rem;line-height:1.65;color:var(--dim)">
    Everything is hip-hop and rap, and it never runs out. <b style="color:var(--text)">Share</b>
    copies your result plus a link that drops a friend on the exact same song.
  </p>
`

/* ============================ boot ============================ */

async function boot() {
  $('btn-eras').onclick = () => {
    pendingEras = loadEras()
    openModal(erasHtml())
    wireEras()
  }
  $('btn-stats').onclick = () => openModal(statsHtml())
  $('btn-how').onclick = () => openModal(HOW_HTML)
  $('modal-close').onclick = () => { $('modal').hidden = true }
  $('modal').onclick = e => { if (e.target.id === 'modal') $('modal').hidden = true }

  let data
  try {
    const res = await fetch('songs.json', { cache: 'no-cache' })
    if (!res.ok) throw new Error(`HTTP ${res.status}`)
    data = await res.json()
  } catch (err) {
    $('app').innerHTML = `
      <div class="card">
        <div class="err"><b>Could not load songs.json</b><br>${esc(err.message)}</div>
        <p class="note">
          If you opened this file directly, browsers block <code>fetch</code> on
          <code>file://</code>. Run <code>node serve.mjs</code> in this folder and
          open <a href="http://localhost:3000" style="color:var(--gold)">localhost:3000</a>.
        </p>
      </div>`
    return
  }

  CATALOG = (Array.isArray(data) ? data : data.songs || [])
    .filter(s => s && s.trackId && s.previewUrl && s.artist && s.title)

  for (const s of CATALOG) s._search = `${norm(s.artist)} ${norm(s.title)}`
  applyEras()

  if (!CATALOG.length) {
    $('app').innerHTML = `<div class="card"><div class="err">The catalog is empty.</div></div>`
    return
  }


  audio.volume = 0.75

  // #t=<trackId> drops you on a specific song (challenge links).
  const m = location.hash.match(/t=(\d+)/)
  const target = m ? CATALOG.find(s => s.trackId === Number(m[1])) : null

  if (target) {
    if (!POOL.some(s => s.trackId === target.trackId)) POOL = [target, ...POOL]
    guesses = []; finished = false; won = false
    song = target
    audio.src = song.previewUrl
    render()
    toast('Challenge song loaded')
  } else {
    await newRound()
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('modal').hidden) $('modal').hidden = true
})

boot()
</script>
</body>
</html>
